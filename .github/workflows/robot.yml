name: Robot AfriPepites

on:
  workflow_dispatch:
    inputs:
      pays:
        description: "Codes pays separes par des espaces (ex : BJ  ou  BJ TG). VIDE = tous les pays, en 3 groupes"
        default: ""
      passage:
        description: "Lancer un des 4 passages du jour (1 = 0h, 2 = 6h, 3 = 12h, 4 = 20h). VIDE = tous les pays. Ignore si 'pays' est rempli."
        type: choice
        options: ["", "1", "2", "3", "4"]
        default: ""
      mots:
        description: "Mots a chercher separes par des espaces (vide = tous les mots du robot)"
        default: ""
      defilements:
        description: "Nombre de defilements par recherche"
        default: "6"
      mode:
        description: "collecte (normal) ou suivi (vendeurs suivis seulement)"
        type: choice
        options: [collecte, suivi]
        default: collecte
  # Lancement automatique, 4 fois par jour : 0h17, 6h17, 12h17 et 20h17 (heure du Benin),
  # avec 2 robots (2 groupes de pays) a chaque fois. (voir l'etape "plan")
  schedule:
    - cron: "17 23,5,11,19 * * *"
    # Declencheur de secours, 30 minutes apres : GitHub retarde ou saute parfois le premier.
    # L'etape "plan" ignore ce lancement si un robot a deja demarre dans les 110 dernieres minutes.
    - cron: "47 23,5,11,19 * * *"

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groupes: ${{ steps.p.outputs.groupes }}
      suivis: ${{ steps.p.outputs.suivis }}
    steps:
      - id: p
        env:
          PAYS: ${{ inputs.pays }}
          PASSAGE: ${{ inputs.passage }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Lancement automatique : si un autre robot a deja demarre il y a moins de 110 minutes,
          # on ne fait rien (evite les doublons entre le declencheur normal et celui de secours).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            RECENT=$(gh api "repos/$REPO/actions/workflows/robot.yml/runs?per_page=15" 2>/dev/null | jq --argjson id "$RUN_ID" '[.workflow_runs[] | select(.id < $id and .conclusion != "cancelled" and .conclusion != "skipped" and ((now - (.created_at|fromdateiso8601)) < 6600))] | length' 2>/dev/null || echo 0)
            if [ "${RECENT:-0}" -gt 0 ]; then
              echo "Un robot a deja demarre recemment : rien a faire."
              echo "groupes=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Les 4 passages du jour (2 robots chacun)
          P1='["BJ TG","CI SN CM"]'      # 0h17 Benin
          P2='["ML BF NE","GN MR SL"]'   # 6h17 Benin
          P3='["NG GH","GA CG CD"]'      # 12h17 Benin
          P4='["TD CF LR GM","FR CA"]'   # 20h17 Benin
          if [ -n "$PAYS" ]; then
            echo "groupes=$(jq -cn --arg p "$PAYS" '[$p]')" >> "$GITHUB_OUTPUT"
          elif [ -n "$PASSAGE" ]; then
            case "$PASSAGE" in 1) G="$P1";; 2) G="$P2";; 3) G="$P3";; 4) G="$P4";; esac
            # Le passage 1 (0h17) est aussi celui des annonceurs suivis (1 fois par jour)
            if [ "$PASSAGE" = "1" ]; then echo "suivis=oui" >> "$GITHUB_OUTPUT"; fi
            echo "groupes=$G" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Heures en UTC = Benin - 1h. Plages larges pour tolerer un depart avec du retard.
            H=$((10#$(date -u +%H)))
            if   [ "$H" -ge 22 ] || [ "$H" -lt 2 ]; then G="$P1"; echo "suivis=oui" >> "$GITHUB_OUTPUT"   # annonceurs suivis : 1 fois par jour (0h17)
            elif [ "$H" -lt 9 ];  then G="$P2"
            elif [ "$H" -lt 16 ]; then G="$P3"
            else                       G="$P4"
            fi
            echo "groupes=$G" >> "$GITHUB_OUTPUT"
          else
            echo 'groupes=["BJ TG","CI SN CM","ML BF NE","GN MR SL","NG GH","GA CG CD","TD CF LR GM","FR CA"]' >> "$GITHUB_OUTPUT"
          fi

  # Annonceurs suivis : chaque jour, le robot ramene TOUTES les pubs actives
  # des annonceurs que les utilisateurs suivent dans l'application (bouton "Suivre").
  suivis:
    needs: plan
    if: needs.plan.outputs.suivis == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: ["1/3", "2/3", "3/3"]   # 3 robots en meme temps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le robot et son navigateur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Lancer le robot sur les annonceurs suivis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CODE_ROBOT: ${{ secrets.CODE_ROBOT }}
          ROBOT_CAPTURE: "1"
          PART: ${{ matrix.part }}
        run: xvfb-run -a python collecteur4.py --suivi --pays-connus --part "$PART" --defilements 12
      - name: Garder les photos d'ecran en cas de probleme
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-suivis-${{ strategy.job-index }}
          path: capture_*.png
          if-no-files-found: ignore
          retention-days: 7

  collecte:
    needs: plan
    if: needs.plan.outputs.groupes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        groupe: ${{ fromJSON(needs.plan.outputs.groupes) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le robot et son navigateur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Lancer le robot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CODE_ROBOT: ${{ secrets.CODE_ROBOT }}
          ROBOT_CAPTURE: "1"
          PAYS: ${{ matrix.groupe }}
          MOTS: ${{ inputs.mots }}
          DEFIL: ${{ inputs.defilements || '6' }}
          MODE: ${{ inputs.mode || 'collecte' }}
        run: |
          CMD=(xvfb-run -a python collecteur4.py --pays $PAYS --defilements "$DEFIL")
          if [ "$MODE" = "suivi" ]; then CMD+=(--suivi); fi
          if [ -n "$MOTS" ]; then CMD+=(--mots $MOTS); fi
          echo "Commande : ${CMD[*]}"
          "${CMD[@]}"

      - name: Garder les photos d'ecran en cas de probleme
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ strategy.job-index }}
          path: capture_*.png
          if-no-files-found: ignore
          retention-days: 7
