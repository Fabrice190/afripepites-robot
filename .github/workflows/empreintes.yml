name: Empreintes des images (recherche par image)

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Nombre maximum d'images a traiter pendant ce lancement"
        default: "1500"
  # Se lance tout seul apres chaque collecte terminee.
  workflow_run:
    workflows: ["Robot AfriPepites"]
    types: [completed]

concurrency:
  group: empreintes
  cancel-in-progress: false

jobs:
  empreintes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: modele_cache
          key: modele-clip-b32-v1

      - name: Installer
        run: pip install fastembed pillow numpy

      - name: Calculer les empreintes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CODE_ROBOT: ${{ secrets.CODE_ROBOT }}
          MAX: ${{ inputs.max || '4000' }}
        run: python empreintes.py --max "$MAX"
